function sortedAccounts(list){
  return list.slice().sort((a,b)=>{
    // 优先按有无有效活动排序
    const aHasReward = (state.rewardRules||[]).some(r=>r.accountId===a.id&&(r.cycle==='monthly'||r.endDate>=now()));
    const bHasReward = (state.rewardRules||[]).some(r=>r.accountId===b.id&&(r.cycle==='monthly'||r.endDate>=now()));

function renderCurrencyGroups(currency,accounts,ignoreCurrency=false){
 const byGroup=new Map();for(const a of accounts){const group=String(a.group||'').trim();if(!byGroup.has(group))byGroup.set(group,[]);byGroup.get(group).push(a)}
 const names=orderedGroupNames(currency,[...byGroup.keys()]);
 return names.map(group=>{
  const list=byGroup.get(group), key=groupKey(currency,group);
  
  // 判断是否为销户/销卡分组
  const isClosedGroup = group.includes('销卡') || group.includes('销户');
  
  // 智能判断折叠状态
  let collapsed;
  if (accountSearch) {
    collapsed = false; // 搜索时强制展开
  } else if (isClosedGroup) {
    // 销卡组：默认折叠，除非用户手动点开过(存在 'open_'+key)
    collapsed = !collapsedGroups.has('open_'+key);
  } else {
    // 普通组：默认展开，除非用户手动折叠了(存在 key)
    collapsed = collapsedGroups.has(key);
  }

  // 统一折算为人民币
  let subtotalCents = 0;
  let hasMissingRate = false;
  list.forEach(a=>{
    const b = balance(a.id);
    const rate = a.currency === 'CNY' ? 1 : Number(state.fxRates?.[a.currency]);
    if (b !== 0 && (!Number.isFinite(rate) || rate <= 0)) {
      hasMissingRate = true;
    } else {
      subtotalCents += b === 0 ? 0 : Math.round(b * rate);
    }
  });
  const subtotalStr = hasMissingRate ? '汇率未齐' : fmt(subtotalCents, 'CNY');
  
  return `<div class="groupBlock"><button class="groupHeader" data-act="toggleGroup" data-id="${E(key)}" aria-expanded="${!collapsed}"><span class="chevron">${collapsed?'▸':'▾'}</span><div class="groupInfo"><b>${E(printableGroup(group))}</b><small>${list.length} 个账户${accountSearch?' · 匹配结果':''}</small></div><span class="groupMoney">${subtotalStr}</span></button>${collapsed?'':`<div class="card">${sortedAccounts(list).map(accountRow).join('')}</div>`}</div>`
 }).join('')
}

function sortDraggedAt(e){if(!dragSorter)return;const ghost=dragSorter.ghost;ghost.style.left=(e.clientX+16)+'px';ghost.style.top=(e.clientY+12)+'px';const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-sort-item]');if(dragSorter.hover)dragSorter.hover.classList.remove('sortOver');dragSorter.hover=null;if(target&&target!==dragSorter.from&&target.dataset.sortItem===dragSorter.from.dataset.sortItem&&(target.dataset.sortItem==='group'?target.closest('.sortGroupList')===dragSorter.from.closest('.sortGroupList'):target.parentElement===dragSorter.from.parentElement)){dragSorter.hover=target;target.classList.add('sortOver')}}

function rewardNet(rule){
 const catSet=new Set(rule.includeCategories||[]);
 let spent=0,refunded=0,cashback=0;
 for(const x of state.transactions){
  if(x.from!==rule.accountId)continue;
  if(x.date<rule.startDate||x.date>rule.endDate)continue;
  const cats=x.splits?.length?[x.category,...x.splits.map(s=>s.category)]:[x.category];
  if(catSet.size&&!cats.some(c=>catSet.has(c)))continue;
  if(x.type==='expense')spent+=x.amount;
  else if(x.type==='refund')refunded+=x.amount;
  else if(x.type==='income'&&x.category==='银行返现')cashback+=x.amount;
 }
 return Math.max(0,spent-refunded-cashback);
}

    const today = new Date(now()+'T12:00:00');
    let bDay = new Date(today.getFullYear(), today.getMonth(), Math.min(a.billDay||5, monthLastDay(today.getFullYear(), today.getMonth()+1)));
    
    // 如果今天还没到本月的账单日，那上一期账单日在上个月
    if(today < bDay) {
      bDay.setMonth(bDay.getMonth() - 1);
    }
    
    // 计算还款日 = 账单日 + 宽限天数
    let dueDate = new Date(bDay.getTime());
    dueDate.setDate(dueDate.getDate() + (a.payDayOffset||20));
    
    // 如果算出来的还款日已经小于今天（说明已经逾期了），就顺延到下一期账单的还款日
    if(dueDate < today) {
      let nextMonth = bDay.getMonth() + 1;
      let nextYear = bDay.getFullYear();
      bDay = new Date(nextYear, nextMonth, Math.min(a.billDay||5, monthLastDay(nextYear, nextMonth+1)));
      
      dueDate = new Date(bDay.getTime());
      dueDate.setDate(dueDate.getDate() + (a.payDayOffset||20));
    }
    return `${dueDate.getMonth()+1}月${dueDate.getDate()}日`;
  }
  return a.payDay+'日';
})()}</b></div>
</div></details>`:'';
return `<div class="backRow"><button class="linkStyle" data-act="backAccounts">${ic('left')} 返回账户</button><button class="btn tiny soft" data-act="accountActions" data-id="${E(a.id)}"> 账户操作</button></div><div class="detailHead v41DetailHead" data-v41-theme="${E(a.id)}" style="${v41GradientStyle(a)}"><div class="detailIdentity"><span class="accountIcon ${colors(a.id)}">${accountIconContent(a)}</span><div class="name">${E(a.name)}</div></div><div class="subtle" style="margin-top:5px">${E(a.currency)} · ${E(a.kind==='credit'?'信用卡':a.kind==='wallet'?'钱包':a.kind==='loan'?'贷款':'个人账户')}${a.includeInWealth===false?' · 不计入资产负债统计':''}</div><div class="balance">${fmt(b,a.currency)}</div><div class="miniStats"><span>本月收入 <b class="positive">+${fmt(inc,a.currency)}</b></span><span>本月支出 <b>${fmt(out,a.currency)}</b></span></div></div><div class="toolbar accountToolbar">
<button class="btn soft" data-act="newTx" data-id="${E(a.id)}">记一笔</button>
<button class="btn soft" data-act="searchAccountTx" data-id="${E(a.id)}">查交易</button>
</div>${rewardRulesFor(a.id).length?`<div class="sectionTitle"><h2>消费奖励</h2><button class="btn tiny soft" data-act="newRewardRule" data-id="${E(a.id)}">＋ 新增规则</button></div>${rewardBlock}`:`<div class="sectionTitle"><h2>消费奖励</h2><button class="btn tiny soft" data-act="newRewardRule" data-id="${E(a.id)}">＋ 新增规则</button></div><div class="notice blueTint">尚未设置消费奖励规则。可设置起止日期、目标档位和统计分类。</div>`}${cc?`<div style="margin-top:14px">${cc}</div>`:''}<div class="sectionTitle"><h2>交易流水</h2><span class="subtle">${txs.length} 笔</span></div><div class="card">${txs.length?txs.map(x=>txRow(x,a.id)).join(''):'<div class="empty">暂无交易记录</div>'}</div>`}

function txLabel(x){if(x.type==='transfer')return '账户转账';if(x.type==='loan_repayment')return '贷款还款';if(x.type.startsWith('transfer_'))return '转账记录';return x.description||x.category||({income:'收入',expense:'支出',refund:'退款',adjustment:'余额调整'})[x.type]||'交易'}
function sortTx(a,b){return (b.date+' '+(b.time||'')).localeCompare(a.date+' '+(a.time||''))||String(b.created||'').localeCompare(String(a.created||''))}
function txRow(x,accId=''){
  let v=txSigned(x,accId);
  const cur=account(accId||x.from)?.currency||'CNY';
  let displayCur=x.type==='transfer'&&accId===x.to?(account(x.to)?.currency||cur):cur;
  let amount=x.type==='transfer'&&!accId?fmt(x.amount,cur):fmt(v,displayCur,true);
  let trans=x.type.startsWith('transfer')||x.type==='loan_repayment';
  let note=['transfer','loan_repayment'].includes(x.type)?`${aName(x.from)} → ${aName(x.to)}`:aName(x.from);
  let glyph=trans?'↔':['income','refund'].includes(x.type)?'+':x.type==='expense'?'−':'◦';
  let extras=[x.category,x.payee,(x.type==='loan_repayment'?`本金 ${fmt(x.principal,cur)} · 利息 ${fmt(x.interest,cur)}`:x.type==='transfer'&&account(x.from)?.currency===account(x.to)?.currency&&x.amount!==x.toAmount?`转账差额 ${fmt(Math.abs(x.toAmount-x.amount),cur)}（${x.transferDeltaKind==='discount'?'优惠':x.transferDeltaKind==='fee'?'手续费':'其他'}）`:''),(x.transferPeer?'往来账户：'+x.transferPeer:''),note,(x.discount>0?'立减 '+fmt(x.discount,cur):''),tagsText(x)].filter(Boolean).join(' · ');
  
  // 批量模式：添加多选框
  const cb = ledgerBatchMode ? `<input type="checkbox" data-batch-tx="${E(x.id)}" ${selectedTxIds.includes(x.id)?'checked':''} style="width:20px;height:20px;accent-color:#2286fa;margin-right:8px;flex-shrink:0" onclick="event.stopPropagation()">` : '';
  // 批量模式：点击行不再跳转详情
  const clickAct = ledgerBatchMode ? '' : 'data-act="viewTx"';

  return `<div class="txRow" ${clickAct} data-id="${E(x.id)}">${cb}<span class="txGlyph ${trans?'transfer':x.type}">${glyph}</span><span class="txMain"><div class="txTitle">${E(txLabel(x))}</div><div class="txInfo">${E(x.date+(x.time?' '+x.time:''))} · ${E(extras.slice(0,230))}</div></span><span class="txMoney ${['income','refund'].includes(x.type)?'positive':['expense','loan_repayment'].includes(x.type)?'expense':x.type.startsWith('transfer')?'transferAmount':'zero'}">${E(amount)}</span></div>`
}

function toDateToken(s){const m=String(s||'').match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})$/);if(!m)return null;const y=+m[1],mo=+m[2],d=+m[3];const dt=new Date(Date.UTC(y,mo-1,d));if(dt.getUTCFullYear()!==y||dt.getUTCMonth()+1!==mo||dt.getUTCDate()!==d)return null;return `${m[1]}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`}
function compareAmount(value,op,threshold){if(!Number.isSafeInteger(threshold)||threshold<0)return false;return op==='gt'?value>threshold:op==='lt'?value<threshold:op==='eq'?value===threshold:op==='approx'?Math.abs(value-threshold)<=Math.max(100,Math.round(threshold*.10)):true}
function parseQuick(q){const result={text:[],amount:[],dates:[]};for(let token of String(q||'').trim().split(/\s+/).filter(Boolean)){
 const m=token.match(/^([<>]=?|=|~)([\d,]+(?:\.\d{1,2})?)$/);if(m){const n=Number(m[2].replaceAll(',',''));if(Number.isFinite(n)&&n>=0){const op={'>' :'gt','<':'lt','=':'eq','~':'approx','>=':'gte','<=':'lte'}[m[1]];result.amount.push({op,val:Math.round(n*100)});continue}}
 const range=token.match(/^(\d{4}[-/]\d{1,2}[-/]\d{1,2})(?:\.\.|~|-)(\d{4}[-/]\d{1,2}[-/]\d{1,2})$/);if(range){const d1=toDateToken(range[1]),d2=toDateToken(range[2]);if(d1&&d2){result.dates.push({op:'range',a:d1,b:d2});continue}}
 const dcomp=token.match(/^([<>])(\d{4}[-/]\d{1,2}[-/]\d{1,2})$/);if(dcomp){const date=toDateToken(dcomp[2]);if(date){result.dates.push({op:dcomp[1]==='>'?'after':'before',a:date});continue}}
 const exact=toDateToken(token);if(exact){result.dates.push({op:'exact',a:exact});continue}
 result.text.push(token.toLocaleLowerCase());
 }return result}
function txSearchAmount(x){const a=filter.accounts||[];if(a.length===1&& (x.from===a[0]||x.to===a[0]))return Math.abs(delta(x,a[0]));if(a.length>1&&x.to&&!a.includes(x.from)&&a.includes(x.to))return Math.abs(delta(x,x.to));return x.amount}
const txSearchType=x=>x.type.startsWith('transfer')?'transfer':x.type;
function dateMatch(day,p){return p.op==='exact'?day===p.a:p.op==='after'?day>p.a:p.op==='before'?day<p.a:p.op==='range'?day>=p.a&&day<=p.b:true}
function txCategories(x){return [x.category,...(x.splits||[]).map(s=>s.category)].filter(Boolean)}
function matchesSelectedCategory(x,selected){return txCategories(x).some(cat=>selected.some(v=>cat===v||cat.startsWith(v+'/')||cat.startsWith(v+' → ')||cat.startsWith(v+'>')))}
function filtered(){const f=filter;const quick=parseQuick(f.q);const threshold=Number(f.amountValue);const advCents=f.amountOp!=='any'&&f.amountValue!==''&&Number.isFinite(threshold)&&threshold>=0?Math.round(threshold*100):null;
 return state.transactions.filter(x=>{
  if(ledgerScope&&x.from!==ledgerScope&&x.to!==ledgerScope)return false;
  if(!ledgerScope&&f.accounts.length&&!f.accounts.some(a=>x.from===a||x.to===a))return false;
  if(f.types.length&&!f.types.includes(txSearchType(x)))return false;
  if(f.categories.length&&!matchesSelectedCategory(x,f.categories))return false;
  if(f.tags.length&&!f.tags.some(tag=>(x.tags||[]).includes(tag)))return false;
  if(f.month&&!x.date.startsWith(f.month))return false;
  const value=txSearchAmount(x);
  if(advCents!==null&&!compareAmount(value,f.amountOp,advCents))return false;
  if(f.dateOp!=='any'){let start=toDateToken(f.dateStart),end=toDateToken(f.dateEnd);if(!start)return false;if(f.dateOp==='range'&&!end)return false;if(!dateMatch(x.date,{op:f.dateOp,a:start,b:end}))return false}
  for(const a of quick.amount){if(a.op==='gte'?(value<a.val):a.op==='lte'?(value>a.val):!compareAmount(value,a.op,a.val))return false}
  for(const date of quick.dates)if(!dateMatch(x.date,date))return false;
  const str=[x.description,x.note,x.payee,x.category,tagsText(x),...(x.splits||[]).map(v=>v.category)].filter(Boolean).join(' ').toLocaleLowerCase();
  return quick.text.every(word=>str.includes(word))
 }).sort(sortTx)}
function ledgerSummary(list){
 const rows=new Map();const accountId=ledgerScope||(filter.accounts.length===1?filter.accounts[0]:'');
 for(const x of list){const a=account(accountId||x.from);if(!a)continue;const cur=a.currency||'CNY';const v=rows.get(cur)||{count:0,gross:0,income:0,expense:0,refund:0,transfer:0,adjustment:0,balanceDelta:0};let actual=accountId?delta(x,accountId):txSigned(x);
 v.count++;v.gross+=Math.abs(accountId?actual:x.amount);
 if(x.type==='income')v.income+=x.amount;
 else if(x.type==='expense')v.expense+=x.amount;
 else if(x.type==='refund')v.refund+=x.amount;
 else if(x.type==='loan_repayment')v.expense+=x.interest+x.loanFee;
  else if(x.type==='transfer'){v.transfer+=(accountId?actual:0);if(x.transferDeltaKind==='fee'&&account(x.from)?.currency===account(x.to)?.currency&&x.amount>x.toAmount)v.expense+=x.amount-x.toAmount;}
  else if(x.type.startsWith('transfer'))v.transfer+=(accountId?actual:0);
 else if(x.type==='adjustment')v.adjustment+=(accountId?actual:0);
 if(accountId)v.balanceDelta+=actual;rows.set(cur,v)
 }
 if(!rows.size)return '<div class="notice blueTint">当前筛选没有匹配交易，合计为零。</div>';
 return [...rows.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(([cur,v])=>{const net=v.income-v.expense+v.refund;const cell=(label,value,cls='')=>`<div class="ledgerTotal"><small>${label}</small><b class="${cls}">${fmt(value,cur,true)}</b></div>`;return `<section><h3>${E(cur)} · ${v.count} 笔</h3><div class="ledgerTotalGrid">${cell('收入合计',v.income,'plus')}${cell('支出合计',-v.expense,'minus')}${cell('退款合计',v.refund,'plus')}${cell('净收支（不含转账）',net,'net')}${accountId?cell('该账户余额变化（含转账、调整）',v.balanceDelta,'net'):''}</div></section>`}).join('')+'<p class="smallHint">汇总全部匹配交易，包括列表未显示的部分；转账与余额调整不计入净收支。不同币种分别统计，金额筛选使用各交易账户币种。若选多账户，跨账户转账在结果中只计一笔。</p>'
}

function accountSelectorChecklist(selected){
  const groups={};

  }
  let html='';
  const allGroups = groupNames();
  const sortedGroupKeys = Object.keys(groups).sort((a,b)=>{

    return ai>=0&&bi>=0?ai-bi:ai>=0?-1:bi>=0?1:!a?1:!b?-1:a.localeCompare(b,'zh-CN');
  });

  for(const gName of sortedGroupKeys){

    for(const a of accs){

    }
  }
  return `<details class="advDetails"><summary>账户（可多选）${selected.length?' · 已选 '+selected.length+' 项':''}</summary><div class="advOptions">${html||'<span class="smallHint">暂无可选项</span>'}</div></details>`;
}

function advancedForm(){const f=filter;if(!f.advanced)return '<div class="advPanel" id="advancedFields" hidden></div>';const cat=categoryFilterOptions(),tags=tagFilterOptions();return `<div class="advPanel" id="advancedFields" ${f.advanced?'':'hidden'}><div class="advRow"><div><label class="inputLabel">金额比较</label><select class="field" id="advAmountOp">${[['any','不限'],['gt','大于 >'],['lt','小于 <'],['eq','等于 ='],['approx','约等于 ~（±10%，至少1元）']].map(([v,t])=>`<option value="${v}" ${f.amountOp===v?'selected':''}>${t}</option>`).join('')}</select></div><div><label class="inputLabel">金额（按账户原币种）</label><input class="field" id="advAmountValue" type="number" inputmode="decimal" step="0.01" min="0" placeholder="例如 100" value="${E(f.amountValue)}"></div></div><div class="advRow"><div><label class="inputLabel">日期条件</label><select class="field" id="advDateOp">${[['any','不限'],['exact','精确日期'],['after','此日期之后（不含当天）'],['before','此日期之前（不含当天）'],['range','日期范围（含首尾）']].map(([v,t])=>`<option value="${v}" ${f.dateOp===v?'selected':''}>${t}</option>`).join('')}</select></div><div><label class="inputLabel">日期</label><input class="field" id="advDateStart" type="date" value="${E(f.dateStart)}"></div></div><div id="advDateEndWrap" ${f.dateOp==='range'?'':'hidden'}><label class="inputLabel">结束日期（含当天）</label><input class="field" id="advDateEnd" type="date" value="${E(f.dateEnd)}"></div><p class="smallHint">高级金额、日期条件与搜索框内容同时生效；不同条件需全部满足。</p>${!ledgerScope?accountSelectorChecklist(f.accounts):''}${selectorChecklist('type',txTypes,f.types,'交易类型（可多选）')}${selectorChecklist('category',cat,f.categories,'分类（可多选）')}${selectorChecklist('tag',tags,f.tags,'标签（可多选）')}</div>`}

const options=groupOptions+accOptions;return `${isAccount?`<div class="backRow"><button class="linkStyle" data-act="backFromAccountSearch">${ic('left')} 返回 ${E(aName(ledgerScope))}</button><button class="btn tiny" data-act="toGlobalSearch">全部交易</button></div>`:''}<div class="sectionTitle" style="margin-top:0"><h2>${isAccount?'账户交易搜索':'全部交易'}</h2><span class="subtle" id="ledgerCount">共 ${l.length} 笔</span></div>${isAccount?`<div class="notice blueTint">当前仅搜索「${E(aName(ledgerScope))}」的交易；信用卡还款属于转账，不计收入。</div>`:''}<div class="toolbar ledgerToolbar"><input class="sbox" type="search" id="searchQ" placeholder="描述、备注、商户、分类、标签；可输入 >100 / 2026/11/01-2026/11/15" value="${E(f.q)}" autocomplete="off">${isAccount?'':`<select id="ledgerAccount" aria-label="快捷选择账户"><option value="">${f.accounts.length>1?'已选多个账户':'全部账户'}</option>${options}</select>`}<input id="ledgerMonth" type="month" value="${E(f.month)}" aria-label="月份筛选"></div><div class="searchQuickTypes" id="quickTypes">${[['','全部'],...txTypes].map(([v,label])=>`<button type="button" data-act="quickType" data-id="${v||'_all'}" class="quickType ${(!v&&!f.types.length)||(v&&f.types.length===1&&f.types[0]===v)?'on':''}">${label}</button>`).join('')}</div><div class="searchActions"><button class="btn tiny" data-act="toggleAdvanced" aria-expanded="${f.advanced}">高级筛选${f.advanced?' ▴':' ▾'}</button><button class="btn tiny" data-act="resetSearch">清除所有筛选</button><button class="btn tiny ${ledgerBatchMode?'blue':''}" data-act="toggleBatchMode">${ledgerBatchMode?'退出批量':'批量操作'}</button><span class="subtle">多关键词默认同时匹配</span></div>${ledgerBatchMode?`<div class="notice blueTint" style="display:flex;justify-content:space-between;align-items:center;margin:10px 0"><span>已选择 <b>${selectedTxIds.length}</b> 笔交易</span><button class="btn tiny blue" data-act="batchUpdateCategory">修改分类</button></div>`:''}${advancedForm()}<div class="notice blueTint" style="margin:12px 0">快捷语法：<b>&gt;100</b>、<b>&lt;50</b>、<b>=75</b>、<b>~200</b>；<b>2026/11/15</b>、<b>&g       discount=list.filter(x=>x.type==='expense').reduce((s,x)=>s+discountsIn(x),0);

<div class="card settingsCard"><div class="sectionTitle" style="margin-top:0"><h2>实际支出分类</h2><span class="subtle">${ranked.length} 类</span></div>${ranked.length?ranked.map(([c,v])=>`<div class="barRow"><div class="barName"><span>${E(c)}</span><b>${fmt(v,currency)}</b></div><div class="barTrack"><div class="barFill" style="width:${Math.min(100,Math.round(v/ranked[0][1]*100))}%"></div></div></div>`).join(''):'<div class="empty">该时间段暂无支出</div>'}</div>

async function compressAccountIcon(file){
 if(!['image/png','image/jpeg','image/webp'].includes(file.type))throw Error('账户图标仅支持 PNG、JPG 或 WEBP');
 if(file.size>5*1024*1024)throw Error('账户图标不能超过5MB');
 let url=URL.createObjectURL(file);
 try{
  let pic=new Image();pic.src=url;await new Promise((resolve,reject)=>{pic.onload=resolve;pic.onerror=()=>reject(Error('图片读取失败'))});
  let canvas=document.createElement('canvas');canvas.width=128;canvas.height=128;
  let ctx=canvas.getContext('2d');if(!ctx)throw Error('浏览器无法处理图片');
  const crop=Math.min(pic.naturalWidth,pic.naturalHeight);
  ctx.drawImage(pic,(pic.naturalWidth-crop)/2,(pic.naturalHeight-crop)/2,crop,crop,0,0,128,128);
  const data=canvas.toDataURL('image/png');
  if(data.length>340000)throw Error('压缩后的图标仍然过大，请换一张简单的图片');
  return data;
 }finally{URL.revokeObjectURL(url)}
}

let categoryTarget=null,categoryManager=false;
const defaultExpenseCategories=['餐饮','购物','交通','生活日用','居家','医疗','教育','娱乐','旅行','通讯','其他支出'];
const defaultIncomeCategories=['工资','奖金','利息','银行返现','理财收益','其他收入'];
function categoryUsage(){const m=new Map();
 const add=(name,type)=>{name=String(name||'').trim();if(!name)return;let a=m.get(name)||{name,total:0,expense:0,income:0,custom:false};a.total++;a[type==='income'?'income':'expense']++;m.set(name,a)};
 for(const t of state.transactions){if(['expense','income','refund'].includes(t.type)){if(t.splits?.length&&t.type==='expense')for(const r of t.splits)add(r.category,'expense');else add(t.category,t.type)}}
 for(const name of (state.customCategories||[])){let x=m.get(name)||{name,total:0,expense:0,income:0,custom:false};x.custom=true;m.set(name,x)}
 for(const name of [...defaultExpenseCategories,...defaultIncomeCategories])if(!m.has(name))m.set(name,{name,total:0,expense:0,income:0,custom:false});

function getPeriodRange(rule, baseDate=new Date()){
  if(rule.cycle!=='monthly') return {start:rule.startDate, end:rule.endDate, label:`${rule.startDate} ~ ${rule.endDate}`};
  let y=baseDate.getFullYear(), m=baseDate.getMonth(); // 0-11
  const sd=rule.startDay||1, ed=rule.endDay||31;
  let start, end;
  if(ed>=sd){ // 不跨月
    start=new Date(y,m,Math.min(sd,monthLastDay(y,m+1)));
    end=new Date(y,m,Math.min(ed,monthLastDay(y,m+1)));
    if(baseDate<start){ m--; if(m<0){m=11;y--;} start=new Date(y,m,Math.min(sd,monthLastDay(y,m+1))); end=new Date(y,m,Math.min(ed,monthLastDay(y,m+1))); }
  } else { // 跨月
    start=new Date(y,m,Math.min(sd,monthLastDay(y,m+1)));
    let em=m+1, ey=y; if(em>11){em=0;ey++;}
    end=new Date(ey,em,Math.min(ed,monthLastDay(ey,em+1)));
    if(baseDate<start){ m--; if(m<0){m=11;y--;} start=new Date(y,m,Math.min(sd,monthLastDay(y,m+1))); em=m+1; ey=y; if(em>11){em=0;ey++;} end=new Date(ey,em,Math.min(ed,monthLastDay(ey,em+1))); }
  }
  const pad=n=>String(n).padStart(2,'0');
  const fmtDate=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  return {start:fmtDate(start), end:fmtDate(end), label:`${pad(start.getMonth()+1)}.${pad(start.getDate())} - ${pad(end.getMonth()+1)}.${pad(end.getDate())}`};
}

function checkRewardHistory(){
  if(!state.rewardHistory) state.rewardHistory=[];
  const todayStr=now();
  const todayDate=new Date();
  
  for(const rule of (state.rewardRules||[])){
    if(rule.cycle==='monthly'){
      // 强制回溯 6 个月
      for(let i=1; i<=6; i++){
        const base = new Date(todayDate.getFullYear(), todayDate.getMonth() - i + 1, 15); 
        const period = getPeriodRange(rule, base);
        if(period.end >= todayStr) continue; 
        
        const exists = state.rewardHistory.find(h=>h.ruleId===rule.id && h.start===period.start);
        if(!exists){
          const net = rewardNet({...rule, startDate: period.start, endDate: period.end});
          if(net>0){
            const achieved = rule.targets.filter(t=>net>=t.amount).map(t=>t.label);
            state.rewardHistory.push({id:uid(), ruleId:rule.id, name:rule.name, start:period.start, end:period.end, net, achieved});
          }
        }
      }
    } else {
      if(rule.endDate < todayStr){
        const exists = state.rewardHistory.find(h=>h.ruleId===rule.id);
        if(!exists){
          const net = rewardNet(rule);
          if(net>0){
            const achieved = rule.targets.filter(t=>net>=t.amount).map(t=>t.label);
            state.rewardHistory.push({id:uid(), ruleId:rule.id, name:rule.name, start:rule.startDate, end:rule.endDate, net, achieved});
          }
        }
      }
    }
  }

function csvNumber(v){let s=String(v??'').trim();if(!s)return NaN;let neg=/^\(.*\)$/.test(s)||/^-/.test(s)||/-$/.test(s);s=s.replace(/[\s\u00a0¥￥$€£₹（）()A-Za-z]/g,'').replace(/[^\d.,-]/g,'').replaceAll('-','');if(s.includes(',')&&s.includes('.')){s=s.lastIndexOf(',')>s.lastIndexOf('.')?s.replaceAll('.','').replace(',','.'):s.replaceAll(',','')}else if(s.includes(',')){let arr=s.split(',');if(arr.at(-1).length<=2)s=arr.slice(0,-1).join('')+'.'+arr.at(-1);else s=arr.join('')}const n=Number(s);return Number.isFinite(n)?n*(neg?-1:1):NaN}
function dateVal(v,mode='MDY'){let s=String(v??'').trim();if(!s)return null;s=s.replace(/[年月]/g,'/').replace(/[日号]/g,'').replace(/\s*T\s*/,' ').replace(/\./g,'/').replace(/-/g,'/');let m=s.match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})(?:\s+(\d{1,2}):(\d{2}))?/);let yy,mm,dd;if(m){yy=+m[1];mm=+m[2];dd=+m[3]}else{m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2}))?/);if(!m)return null;yy=+m[3];mm=+(mode==='MDY'?m[1]:m[2]);dd=+(mode==='MDY'?m[2]:m[1])}let d=new Date(yy,mm-1,dd);if(d.getFullYear()!==yy||d.getMonth()+1!==mm||d.getDate()!==dd)return null;return {date:`${yy}-${String(mm).padStart(2,'0')}-${String(dd).padStart(2,'0')}`,time:m[4]?`${m[4].padStart(2,'0')}:${m[5]}`:''}}
function hashString(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(16)}
function classifyType(raw,amount,category,transferMark){let ty=String(raw||'').toLowerCase();let cat=String(category||'').toLowerCase();let tr=String(transferMark||'').trim();let isTransfer=/(transfer|转账|轉賬)/i.test(ty)||/(transfer|转账|轉賬)/i.test(cat)||!!tr&&! /^(false|no|none|0|否|无|n\/a)$/i.test(tr);if(isTransfer)return amount<0?'transfer_out':'transfer_in';if(/^(refund|退款|商户退款)$/.test(ty))return 'refund';if(/^(adjustment|余额调整)$/.test(ty))return 'adjustment';if(/(expense|withdraw|debit|payment|支出|消费|消費|付款)/i.test(ty))return 'expense';if(/(income|deposit|credit|收入|收款|退款)/i.test(ty))return 'income';return amount<0?'expense':'income'}

/* MoneyWiz same-field export. Account summary rows represent current balances; they are not opening balances. */
function v39MWRows(opts={}){
 let rows=[];
 const accSet=opts.accountIds&&opts.accountIds.length?new Set(opts.accountIds):null;
 for(const a of state.accounts){if(accSet&&!accSet.has(a.id))continue;const r=Array(14).fill('');r[0]=a.name;r[1]=(balance(a.id)/100).toFixed(2);rows.push(r)}
 const transactionRow=(x,accId,amount,peer)=>{
   const a=account(accId);if(!a)return;
   const r=Array(14).fill('');r[2]=a.name;r[3]=peer||x.transferPeer||'';r[4]=x.description||'';r[5]=x.payee||'';
   r[6]=(x.importOriginalCategory&&v422Cat(x.importOriginalCategory,x.importOriginalCategory.includes('►')?'tree':x.importOriginalCategory.includes('/')?'literal':'tree')===x.category?x.importOriginalCategory:x.category)||'';r[7]=x.date.replaceAll('-', '/');r[8]=x.time||'';r[9]=[x.note||'',x.type==='loan_repayment'&&accId===x.from?`贷款本金 ${(x.principal/100).toFixed(2)}；利息 ${(x.interest/100).toFixed(2)}；费用 ${(x.loanFee/100).toFixed(2)}`:'',x.type==='transfer'&&account(x.from)?.currency===account(x.to)?.currency&&x.amount!==x.toAmount?`转账${x.transferDeltaKind==='discount'?'优惠':x.transferDeltaKind==='fee'?'手续费':'差额'} ${(Math.abs(x.toAmount-x.amount)/100).toFixed(2)}`:''].filter(Boolean).join('；');
   r[10]=(amount/100).toFixed(2);r[11]=a.currency||'CNY';r[13]=(x.tags||[]).join(';');rows.push(r);
 };
 for(const x of filterExportTx(opts).sort(sortTx)){
   if(x.type==='loan_repayment'){transactionRow(x,x.from,-x.amount,aName(x.to));if(x.principal>0)transactionRow(x,x.to,x.principal,aName(x.from));}
    else if(x.type==='transfer'){
     transactionRow(x,x.from,-x.amount,aName(x.to));
     transactionRow(x,x.to,x.toAmount||x.amount,aName(x.from));
   }else if(x.type==='transfer_out'){transactionRow(x,x.from,-x.amount,x.transferPeer||'')}
   else if(x.type==='transfer_in'){transactionRow(x,x.from,x.amount,x.transferPeer||'')}
   else if(x.type==='income'||x.type==='refund')transactionRow(x,x.from,x.amount,'');
   else if(x.type==='adjustment')transactionRow(x,x.from,x.amount*(x.adjustSign===1?1:-1),'');
   else transactionRow(x,x.from,-x.amount,'');
 }
 return rows;
}
function v39ExportMW(opts={}){

 download(new Blob(['\ufeff'+lines.join('\r\n')+'\r\n'],{type:'text/csv;charset=utf-8'}),`简账_MoneyWiz兼容报表_${now()}${exportFileSuffix(opts)}.csv`);
 t('已导出与 MoneyWiz 相同14列的报表；请另存 JSON 以保留所有扩展字段');
}

function v39RenameCategory(oldName,newName){
 const old=oldName.trim(),dst=newName.trim();if(!old||!dst||old===dst)return false;
 if(dst.length>120)throw Error('分类名称过长');
 // Renaming a parent path also renames all descendant paths.
 let change=s=>s===old?dst:s.startsWith(old+'/')?dst+s.slice(old.length):s;
 for(const x of state.transactions){x.category=change(x.category||'');for(const sp of x.splits||[])sp.category=change(sp.category)}
 state.customCategories=[...new Set([...(state.customCategories||[]),dst].map(change))];
 state.categoryOrder=[...new Set((state.categoryOrder||[]).map(change))];
 state.hiddenCategories=[...new Set([...((state.hiddenCategories||[]).map(change)),old])].filter(x=>x!==dst);
 return true;
}

   if(count){alert(`此分类已有 ${count} 笔交易，请先修改/合并到其他分类，不能直接删除。`);return;}

   state.hiddenCategories=[...new Set([...(state.hiddenCategories||[]),cat])];
 }else if(act==='moveCategory'){
   let order=[...new Set([...(state.categoryOrder||[]),...list])],idx=order.indexOf(cat),dst=idx+Number(direction);

 }

}

/* Strong encrypted backup via WebCrypto. Password stays only in memory. */
function v39Base64(buf){let binary='',arr=new Uint8Array(buf);for(let i=0;i<arr.length;i+=8192)binary+=String.fromCharCode(...arr.subarray(i,i+8192));return btoa(binary)}
function v39Unbase64(b64){const s=atob(b64);const arr=new Uint8Array(s.length);for(let i=0;i<s.length;i++)arr[i]=s.charCodeAt(i);return arr}
async function v39Key(password,salt,iterations){
 let raw=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations,hash:'SHA-256'},raw,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function v39Encrypt(stateObj,password){
 if(!crypto?.subtle)throw Error('请通过 HTTPS 打开简账，才能使用 Web Crypto 加密');
 let salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),iterations=250000;
 let key=await v39Key(password,salt,iterations);
 const encoded=new TextEncoder().encode(JSON.stringify({...stateObj,exportedAt:new Date().toISOString()}));
 let enc=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,encoded);
 return JSON.stringify({format:'jianzhao-encrypted-backup',version:1,algorithm:'AES-256-GCM',kdf:'PBKDF2-SHA256',iterations,salt:v39Base64(salt),iv:v39Base64(iv),payload:v39Base64(enc)},null,2);
}
async function v39Decrypt(contents,password){
 let o=JSON.parse(contents);if(o.format!=='jianzhao-encrypted-backup'||o.version!==1||o.algorithm!=='AES-256-GCM'||o.kdf!=='PBKDF2-SHA256'||!Number.isInteger(o.iterations)||o.iterations<100000||o.iterations>1000000)throw Error('不是支持的简账加密备份文件');
 if(typeof o.payload!=='string'||o.payload.length>120000000)throw Error('加密备份体积或格式异常');
 let k=await v39Key(password,v39Unbase64(o.salt),o.iterations),plain;
 try{plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:v39Unbase64(o.iv)},k,v39Unbase64(o.payload));}
 catch{throw Error('解密失败：可能是密码错误或文件已损坏');}
 return validate(JSON.parse(new TextDecoder().decode(plain)));
}
function v39RememberBackup(){try{localStorage.setItem('jz39-backup-generated',now()+' '+new Date().toTimeString().slice(0,8))}catch{} }
let v39PreparedBackupFile=null;

 if(storage==='unavailable')throw Error('本机存储不可用，请先解决存储权限');

 v39PreparedBackupFile=new File([encrypted],filename,{type:'application/json'});
 // Web Share API requires a fresh user gesture. Show a new, directly clicked button.
 modal('加密备份已生成',`<div class="notice blueTint">文件已在当前应用中生成，还没有保存到 iCloud。请点击下一步「共享并保存到文件」，从系统菜单选择 iCloud Drive。切勿只保留这一份本地账本。</div><div class="kvline"><span>文件名</span><b>${E(filename)}</b></div><div class="kvline"><span>大小</span><b>${formatFileSize(v39PreparedBackupFile.size)}</b></div><p class="smallHint">密码仅本次使用，不会保存；务必妥善保管。iCloud 中最好保留不同日期的多份备份。</p>`,`<button class="btn soft" data-v39="sharePrepared">共享并保存到“文件”</button><button class="btn" data-v39="downloadPrepared">下载文件</button><button class="btn" data-act="closeModal">关闭</button>`);
}

 if(navigator.canShare?.({files:[f]})&&navigator.share){
  navigator.share({title:'简账加密备份',files:[f]}).then(()=>{v39RememberBackup();t('已调用共享功能；请检查 iCloud Drive 中是否保存成功');closeModal();render()}).catch(e=>{if(e.name!=='AbortError')alert('系统共享失败，请改用下载文件：'+e.message)});

async function v39RestoreEncrypted(){
 const input=document.createElement('input');input.type='file';input.accept='.jzbackup,.json,application/json';
 input.onchange=async()=>{const file=input.files?.[0];if(!file)return;

  const pw=prompt('请输入该加密备份的密码：');if(pw===null)return;
  const data=await v39Decrypt(await file.text(),pw);

  accountDetail='';ledgerScope='';filter=blankFilter();render();t('账本已从加密文件恢复');
 }catch(e){alert('恢复失败：'+e.message)}
 };input.click();
}

/* ===== 统一报表包装 (支持时间/账户/分组) ===== */
function v422ReportSlice(cur,startDate,endDate,ids){
  const summary={income:0,expense:0,refund:0,fee:0,interest:0,loanFee:0,loanPrincipal:0,discount:0,gross:0,paid:0,cats:new Map()};
  const add=(name,value)=>summary.cats.set(name,(summary.cats.get(name)||0)+value);
  
  for(const x of state.transactions){
    if(!ids.has(x.from)||x.date<startDate||x.date>endDate)continue;
    const accCur=account(x.from)?.currency||'CNY';
    const rate=accCur==='CNY'?1:(Number(state.fxRates?.[accCur])||1);
    
    if(x.type==='income')summary.income+=Math.round(x.amount*rate);
    else if(x.type==='expense'){
      summary.expense+=Math.round(x.amount*rate);
      summary.paid+=Math.round(x.amount*rate);
      const dis=Math.round(discountsIn(x)*rate);
      summary.discount+=dis;
      summary.gross+=Math.round(x.amount*rate)+dis;
      for(const sp of (x.splits?.length?x.splits:[{category:x.category||'未分类',amount:x.amount}])){
        add(sp.category||'未分类',Math.round(sp.amount*rate));
      }
    }
    else if(x.type==='refund'){
      summary.refund+=Math.round(x.amount*rate);
      add(x.category||'未分类',-Math.round(x.amount*rate));
    }
    else if(x.type==='loan_repayment'){
      summary.loanPrincipal+=Math.round(x.principal*rate);
      summary.interest+=Math.round(x.interest*rate);
      summary.loanFee+=Math.round(x.loanFee*rate);
      if(x.interest)add('贷款利息',Math.round(x.interest*rate));
      if(x.loanFee)add('贷款费用',Math.round(x.loanFee*rate));
    }
    else if(x.type==='transfer'&&x.transferDeltaKind==='fee'&&account(x.to)?.currency===accCur){
      const amount=Math.round(Math.max(0,x.amount-x.toAmount)*rate);
      summary.fee+=amount;
      add('转账手续费',amount);
    }
  }
  summary.netExpense=summary.expense-summary.refund+summary.interest+summary.loanFee+summary.fee;
  summary.net=summary.income-summary.netExpense;
  return summary;
}

  const filteredTx=state.transactions.filter(x=>x.date>=reportDateStart&&x.date<=reportDateEnd&&accIds.has(x.from));
  const calc=(x,amt)=>{const ac=account(x.from)?.currency||cur;const rate=ac==='CNY'?1:(Number(state.fxRates?.[ac])||1);return Math.round(amt*rate)};
  const loans=filteredTx.filter(x=>x.type==='loan_repayment');
  const transfers=filteredTx.filter(x=>x.type==='transfer');
  const principal=loans.reduce((s,x)=>s+calc(x,x.principal),0), interest=loans.reduce((s,x)=>s+calc(x,x.interest),0), fees=loans.reduce((s,x)=>s+calc(x,x.loanFee),0);
  const discounts=transfers.reduce((s,x)=>s+calc(x,x.transferDeltaKind==='discount'?Math.max(0,x.toAmount-x.amount):0),0), transferFees=transfers.reduce((s,x)=>s+calc(x,x.transferDeltaKind==='fee'?Math.max(0,x.amount-x.toAmount):0),0), otherDelta=transfers.reduce((s,x)=>s+calc(x,x.transferDeltaKind==='other'?x.toAmount-x.amount:0),0);
  
  const panel=`<div class="card settingsCard v41StatsCard"><h3>贷款还款与转账差额</h3><div class="v41InfoGrid"><div><small>偿还贷款本金</small><b style="color:#269b62">${fmt(principal,cur)}</b></div><div><small>贷款利息支出</small><b style="color:#269b62">${fmt(interest,cur)}</b></div><div><small>贷款其他费用</small><b style="color:#269b62">${fmt(fees,cur)}</b></div><div><small>转账即时优惠</small><b style="color:#d94b4b">${fmt(discounts,cur)}</b></div><div><small>转账手续费</small><b style="color:#269b62">${fmt(transferFees,cur)}</b></div><div><small>其他转账差额</small><b style="color:${otherDelta>=0?'#d94b4b':'#269b62'}">${fmt(otherDelta,cur,true)}</b></div></div></div>`;

function v422ReportSlice(cur,startDate,endDate,ids){
 const summary={income:0,expense:0,refund:0,fee:0,interest:0,loanFee:0,loanPrincipal:0,discount:0,gross:0,paid:0,cats:new Map()};
 const add=(name,value)=>summary.cats.set(name,(summary.cats.get(name)||0)+value);
 for(const x of state.transactions){if(!ids.has(x.from)||x.date<startDate||x.date>endDate)continue;
  const accCur=account(x.from)?.currency||'CNY';
  const rate=accCur==='CNY'?1:(Number(state.fxRates?.[accCur])||1);

  if(x.type==='income')summary.income+=Math.round(x.amount*rate);
  else if(x.type==='expense'){
   summary.expense+=Math.round(x.amount*rate);
   summary.paid+=Math.round(x.amount*rate);
   const dis=Math.round(discountsIn(x)*rate);
   summary.discount+=dis;
   summary.gross+=Math.round(x.amount*rate)+dis;
   for(const sp of (x.splits?.length?x.splits:[{category:x.category||'未分类',amount:x.amount}])){
    add(sp.category||'未分类',Math.round(sp.amount*rate));
   }
  }
  else if(x.type==='refund'){
   summary.refund+=Math.round(x.amount*rate);
   add(x.category||'未分类',-Math.round(x.amount*rate));
  }
  else if(x.type==='loan_repayment'){
   summary.loanPrincipal+=Math.round(x.principal*rate);
   summary.interest+=Math.round(x.interest*rate);
   summary.loanFee+=Math.round(x.loanFee*rate);
   if(x.interest)add('贷款利息',Math.round(x.interest*rate));
   if(x.loanFee)add('贷款费用',Math.round(x.loanFee*rate));
  }
  else if(x.type==='transfer'&&x.transferDeltaKind==='fee'&&account(x.to)?.currency===accCur){
   const amount=Math.round(Math.max(0,x.amount-x.toAmount)*rate);
   summary.fee+=amount;
   add('转账手续费',amount);
  }
 }
 summary.netExpense=summary.expense-summary.refund+summary.interest+summary.loanFee+summary.fee;
 summary.net=summary.income-summary.netExpense;
 return summary;
}

if(id==='reportDateEnd'){reportDateEnd=e.target.value;render();return}else if(id==='reportCurrency'){reportCurrency=e.target.value;render()}else if((id==='txFrom'||id==='txTo')&&$('txForm'))adaptTxForm();else if((id==='accountKind'||id==='accountCurrency')&&$('accountForm')){adaptAccountForm();updateAccountIconPreview()}else if(id==='accountIconChoice'&&$('accountForm'))updateAccountIconPreview();else if(id==='accountIconFile'&&$('accountForm')){if(e.target.files?.length)$('accountIconChoice').value='custom';updateAccountIconPreview()}else if(id==='splitToggle')$('splitRows').classList.toggle('hide',!e.target.checked);else if(id==='csvEncoding'&&csvContext&&csvContext.encoding!==e.target.value){const encoding=e.target.value;loadCsv(csvContext.file,encoding).catch(err=>alert('重读CSV失败：'+err.message))}});

// ===== v4.3 信用卡还款强提醒 =====
function checkRepaymentReminders(){
  const today=new Date(); today.setHours(0,0,0,0);
  const thisMonthStr=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0');
  
    // 智能计算距离还款日还有几天（支持固定日期和账单日后N天）
  const getDaysUntilDue = (account, currentDate) => {
    let targetDate;
    if (account.payDayType === 'offset') {
      // 找离今天最近的账单日（若今天未到本月账单日，则取上个月）
      let bDay = new Date(currentDate.getFullYear(), currentDate.getMonth(), Math.min(account.billDay || 5, monthLastDay(currentDate.getFullYear(), currentDate.getMonth() + 1)));
      if (currentDate < bDay) {
        bDay.setMonth(bDay.getMonth() - 1);
      }
      let due = new Date(bDay.getTime());
      due.setDate(due.getDate() + (account.payDayOffset || 20));
      
      // 如果算出来的还款日小于今天，说明已过，顺延到下个月账单日后
      if (due < currentDate) {
        let nextM = bDay.getMonth() + 1;
        let nextY = bDay.getFullYear();
        if (nextM > 11) { nextM = 0; nextY++; }
        bDay = new Date(nextY, nextM, Math.min(account.billDay || 5, monthLastDay(nextY, nextM + 1)));
        due = new Date(bDay.getTime());
        due.setDate(due.getDate() + (account.payDayOffset || 20));
      }
      targetDate = due;
    } else {
      let payDay = account.payDay || 25;
      let target = new Date(currentDate.getFullYear(), currentDate.getMonth(), Math.min(payDay, monthLastDay(currentDate.getFullYear(), currentDate.getMonth() + 1)));
      if (target < currentDate) {
        let nextM = currentDate.getMonth() + 1;
        let nextY = currentDate.getFullYear();
        if (nextM > 11) { nextM = 0; nextY++; }
        target = new Date(nextY, nextM, Math.min(payDay, monthLastDay(nextY, nextM + 1)));
      }
      targetDate = target;
    }
        // 返回相差的天数和具体的日期字符串
    targetDate.setHours(0,0,0,0);
    const days = Math.round((targetDate - currentDate) / (1000 * 60 * 60 * 24));
    const dateStr = `${targetDate.getMonth() + 1}月${targetDate.getDate()}日`;
    return { days, dateStr };
  };

      const targets=[];
  for(const a of state.accounts){
    if(a.kind!=='credit'||a.hidden)continue;
    const group=state.accountGroups.find(g=>g.id===a.groupId);
    if(!group||group.name!=='流动负债')continue;
    
    const { days, dateStr } = getDaysUntilDue(a, today);
    const key=a.id+'_'+thisMonthStr;
    if(days>=0 && days<=2 && !state.repaymentLogs?.[key]){
      targets.push({ ...a, dueDateStr: dateStr, daysLeft: days });
    }
  }
  
  if(targets.length>0)showRepaymentAlert(targets);
}

function showRepaymentAlert(accounts){
  const rows=accounts.map(a=>`<label class="v41BatchItem" style="align-items:flex-start"><input type="checkbox" class="repayCheck" data-id="${E(a.id)}" style="margin-top:3px"><span style="flex:1;min-width:0"><b style="font-size:15px">${E(a.name)}</b><small style="color:#d94b4b;font-weight:bold">还款日：${a.dueDateStr}${a.daysLeft === 0 ? '（今天）' : `（还有 ${a.daysLeft} 天）`}</small></span></label>`).join('');
  
  modal('💳 信用卡还款提醒',`<div class="notice" style="background:#fff0e8;border-color:#f5c7ac;color:#994c22;font-weight:bold">以下信用卡临近还款日，请确认还款状态：</div><div class="v41BatchList" style="margin-top:15px">${rows}</div><p class="smallHint">勾选“已还款”后，本月将不再提醒该卡。</p>`,`<button class="btn blue" id="btnConfirmRepay" disabled data-act="confirmRepayment">确认并关闭</button>`);
  
  // 隐藏右上角的 X 和点击背景关闭功能，强制用户勾选
    isForceModal = true;
  document.querySelector('#modal .circleBtn').style.display='none';
  
  // 监听勾选，只要有没勾的，按钮就禁用
  document.querySelectorAll('.repayCheck').forEach(chk=>{
    chk.addEventListener('change',()=>{
      const allChecked=[...document.querySelectorAll('.repayCheck')].every(c=>c.checked);
      $('btnConfirmRepay').disabled=!allChecked;
    });
  });
}

async function confirmRepayment(){
  const today=new Date();
  const thisMonthStr=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0');
  if(!state.repaymentLogs)state.repaymentLogs={};
  
  document.querySelectorAll('.repayCheck').forEach(chk=>{
    if(chk.checked){
      const key=chk.dataset.id+'_'+thisMonthStr;
      state.repaymentLogs[key]=true;
    }
  });
  
  await save();
  closeModal();
  t('还款状态已记录');
}
