return `<div class="backRow"><button class="linkStyle" data-act="backAccounts">${ic('left')} 返回账户</button><button class="btn tiny" data-act="editAccount" data-id="${E(a.id)}">编辑账户</button></div><div class="detailHead"><div class="detailIdentity"><span class="accountIcon ${colors(a.id)}">${accountIconContent(a)}</span><div class="name">${E(a.name)}</div></div><div class="subtle" style="margin-top:5px">${E(a.currency)} · ${E(a.kind==='credit'?'信用卡':a.kind==='wallet'?'钱包':'个人账户')}${a.includeInWealth===false?' · 不计入资产负债统计':''}</div><div class="balance">${fmt(b,a.currency)}</div><div class="miniStats"><span>本月收入 <b class="positive">+${fmt(inc,a.currency)}</b></span><span>本月支出 <b>${fmt(out,a.currency)}</b></span></div></div><div class="toolbar"><button class="btn blue" data-act="newTx" data-id="${E(a.id)}">${ic('plus')} 记一笔</button><button class="btn" data-act="adjustBalance" data-id="${E(a.id)}">调整余额</button></div>${cc}<div class="sectionTitle"><h2>交易流水</h2><span class="subtle">${txs.length} 笔</span></div><div class="card">${txs.length?txs.map(x=>txRow(x,a.id)).join(''):'<div class="empty">暂无交易记录</div>'}</div>`}

function txLabel(x){if(x.type==='transfer')return '账户转账';if(x.type.startsWith('transfer_'))return '转账记录';return x.description||x.category||({income:'收入',expense:'支出',refund:'退款',adjustment:'余额调整'})[x.type]||'交易'}
function sortTx(a,b){return (b.date+' '+(b.time||'')).localeCompare(a.date+' '+(a.time||''))||String(b.created||'').localeCompare(String(a.created||''))}
function txRow(x,accId=''){let v=txSigned(x,accId);const cur=account(accId||x.from)?.currency||'CNY';let displayCur=x.type==='transfer'&&accId===x.to?(account(x.to)?.currency||cur):cur;let amount=x.type==='transfer'&&!accId?fmt(x.amount,cur):fmt(v,displayCur,true);let trans=x.type.startsWith('transfer');let note=x.type==='transfer'?`${aName(x.from)} → ${aName(x.to)}`:aName(x.from);let glyph=trans?'↔':['income','refund'].includes(x.type)?'+':x.type==='expense'?'−':'◦';let extras=[x.category,x.payee,(x.transferPeer?'往来账户：'+x.transferPeer:''),note,(x.discount>0?'立减 '+fmt(x.discount,cur):''),tagsText(x)].filter(Boolean).join(' · ');return `<div class="txRow" data-act="editTx" data-id="${E(x.id)}"><span class="txGlyph ${trans?'transfer':x.type}">${glyph}</span><span class="txMain"><div class="txTitle">${E(txLabel(x))}</div><div class="txInfo">${E(x.date+(x.time?' '+x.time:''))} · ${E(extras.slice(0,230))}</div></span><span class="txMoney ${v>0||(!accId&&x.type==='income')?'positive':v<0?'':'zero'}">${E(amount)}</span></div>`}

function interpretQuery(x,q){q=q.trim();if(!q)return true;let m=q.match(/^([<>]=?|=|~)\s*([\d,.]+)$/);if(m){let val=Math.round(Number(m[2].replaceAll(',',''))*100),v=x.amount;return m[1]==='>'?v>val:m[1]==='<'?v<val:m[1]==='>='?v>=val:m[1]==='<='?v<=val:m[1]==='='?v===val:Math.abs(v-val)<=Math.max(100,Math.round(val*.1))}
let dateQuery=q.replaceAll('/','-');if(/^\d{4}-\d{2}-\d{2}$/.test(dateQuery))return x.date===dateQuery;if(/^\d{4}-\d{2}-\d{2}\.\.\d{4}-\d{2}-\d{2}$/.test(dateQuery)){let [a,b]=dateQuery.split('..');return x.date>=a&&x.date<=b}return [x.category,x.description,x.payee,x.note,tagsText(x),(x.splits||[]).map(z=>z.category).join(' '),aName(x.from),aName(x.to),x.date].join(' ').toLowerCase().includes(q.toLowerCase())}
function filtered(){return state.transactions.filter(x=>(!filter.account||x.from===filter.account||x.to===filter.account)&&(!filter.month||x.date.startsWith(filter.month))&&interpretQuery(x,filter.q)).sort(sortTx)}
function ledgerSummary(list){
 const rows=new Map();const accountId=filter.account;
 for(const x of list){
  const a=account(accountId||x.from);if(!a)continue;const cur=a.currency||'CNY';
  const v=rows.get(cur)||{count:0,gross:0,income:0,expense:0,refund:0,transfer:0,adjustment:0,balanceDelta:0};
  let actual=accountId?delta(x,accountId):txSigned(x);
  v.count++;v.gross+=Math.abs(accountId?actual:x.amount);
  if(x.type==='income')v.income+=x.amount;
  else if(x.type==='expense')v.expense+=x.amount;
  else if(x.type==='refund')v.refund+=x.amount;
  else if(x.type==='transfer'||x.type==='transfer_in'||x.type==='transfer_out')v.transfer+=(accountId?actual:0);
  else if(x.type==='adjustment')v.adjustment+=(accountId?actual:0);
  if(accountId)v.balanceDelta+=actual;
  rows.set(cur,v);
 }
 if(!rows.size)return '<div class="notice blueTint">当前筛选没有匹配交易，合计为零。</div>';
 return [...rows.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(([cur,v])=>{
  let net=v.income-v.expense+v.refund;
  const cell=(label,value,cls='')=>`<div class="ledgerTotal"><small>${label}</small><b class="${cls}">${fmt(value,cur,true)}</b></div>`;
  return `<section><h3>${E(cur)} · ${v.count} 笔</h3><div class="ledgerTotalGrid">${`<div class="ledgerTotal"><small>匹配金额合计</small><b>${fmt(v.gross,cur)}</b></div>`}${cell('收入合计',v.income,'plus')}${cell('支出合计',-v.expense,'minus')}${cell('退款合计',v.refund,'plus')}${cell('净收支（不含转账）',net,'net')}${accountId?cell('账户余额变化（含转账、调整）',v.balanceDelta,'net'):''}</div></section>`;
 }).join('')+'<p class="smallHint">金额合计为匹配记录的绝对金额之和；净收支＝收入＋退款－支出，不含账户转账及余额调整。不同币种分别汇总。搜索结果超过500笔时，合计仍包含全部匹配记录。</p>';
}
function renderLedger(){const l=filtered(),options=state.accounts.map(a=>`<option value="${E(a.id)}" ${filter.account===a.id?'selected':''}>${E(a.name)}</option>`).join('');return `<div class="sectionTitle" style="margin-top:0"><h2>全部交易</h2><span class="subtle" id="ledgerCount">共 ${l.length} 笔</span></div><div class="toolbar"><input class="sbox" type="search" id="searchQ" placeholder="搜索描述、交易对方、>100、日期" value="${E(filter.q)}" autocomplete="off"><select id="ledgerAccount"><option value="">全部账户</option>${options}</select><input id="ledgerMonth" type="month" value="${E(filter.month)}"></div><div class="notice blueTint" style="margin-bottom:14px">支持金额表达式 <b>&gt;100</b>、<b>&lt;50</b>、<b>=75</b>、<b>~200</b>，也支持日期 <b>2026/11/08</b> 或 <b>2026/11/01..2026/11/30</b>。</div><div class="ledgerTotals" id="ledgerTotals">${ledgerSummary(l)}</div><div class="card" id="ledgerResults">${l.length?l.slice(0,500).map(x=>txRow(x,filter.account)).join(''):'<div class="empty">没有找到匹配的交易记录</div>'}${l.length>500?'<div class="empty">只显示最新500笔，请使用搜索缩小范围。</div>':''}</div>`}
let reportCurrency='CNY';
function renderReports(){let currency=allCurrencies().includes(reportCurrency)?reportCurrency:(allCurrencies()[0]||'CNY');reportCurrency=currency;let accIds=new Set(state.accounts.filter(x=>x.currency===currency).map(x=>x.id));let list=state.transactions.filter(x=>x.date.startsWith(reportMonth)&&accIds.has(x.from));let inc=list.filter(x=>x.type==='income').reduce((s,x)=>s+x.amount,0),out=list.filter(x=>x.type==='expense').reduce((s,x)=>s+x.amount,0),discount=list.filter(x=>x.type==='expense').reduce((s,x)=>s+discountsIn(x),0);
let cats={};list.filter(x=>x.type==='expense').forEach(x=>{const splits=x.splits?.length?x.splits:[{category:x.category||'未分类',amount:x.amount}];splits.forEach(s=>cats[s.category||'未分类']=(cats[s.category||'未分类']||0)+s.amount)});let ranked=Object.entries(cats).sort((a,b)=>b[1]-a[1]);let wealth=wealthSummary();let netAll=wealth.net,missing=wealth.missing;
return `<div class="sectionTitle" style="margin-top:0"><h2>财务报表</h2><span class="subtle">转账不计收支</span></div><div class="toolbar"><input type="month" id="reportMonth" value="${E(reportMonth)}"><select id="reportCurrency">${(allCurrencies().length?allCurrencies():['CNY']).map(c=>`<option value="${E(c)}" ${currency===c?'selected':''}>${E(c)}</option>`).join('')}</select></div><div class="summaryTriplet"><div class="miniCard"><small>本月收入</small><b class="positive">${fmt(inc,currency)}</b></div><div class="miniCard"><small>实际支出</small><b>${fmt(out,currency)}</b></div><div class="miniCard"><small>本月结余</small><b>${fmt(inc-out,currency)}</b></div></div><div class="summaryTriplet"><div class="miniCard"><small>原价消费</small><b>${fmt(out+discount,currency)}</b></div><div class="miniCard"><small>立减优惠</small><b class="positive">${fmt(discount,currency)}</b></div><div class="miniCard"><small>实际支付</small><b>${fmt(out,currency)}</b></div></div><div class="card settingsCard"><div class="sectionTitle" style="margin-top:0"><h2>实际支出分类</h2><span class="subtle">${ranked.length} 类</span></div>${ranked.length?ranked.map(([c,v])=>`<div class="barRow"><div class="barName"><span>${E(c)}</span><b>${fmt(v,currency)}</b></div><div class="barTrack"><div class="barFill" style="width:${Math.min(100,Math.round(v/ranked[0][1]*100))}%"></div></div></div>`).join(''):'<div class="empty">该月份暂无支出</div>'}</div><div class="card settingsCard" style="margin-top:14px"><h3>净资产（纳入统计的账户）</h3><div class="mainNumber" style="font-size:27px">${wealth.complete?fmt(netAll,'CNY'):'—'}</div><p class="smallHint">仅汇总各账户编辑页开启“纳入资产负债统计”的账户。首页隐藏但仍纳入的账户也参与计算。${missing.length?'缺少 '+E(missing.join('、'))+' 的人民币汇率，暂不显示完整合计。':''}</p></div><div class="notice blueTint" style="margin-top:15px">收入中的银行返现仍按普通收入统计；立减优惠仅统计支付时直接减免的金额。退款只调整账户余额。</div>`}

function renderSettings(){return `<div class="sectionTitle" style="margin-top:0"><h2>数据与设置</h2><span class="subtle">本地优先 · 无订阅</span></div><div class="stack"><div class="card settingsCard"><h3>MoneyWiz 数据迁移</h3><p>导入交易 CSV：自动匹配中文或英文字段，支持修改映射、预览、重复识别和无限创建账户。不会修改 MoneyWiz 原账本。附件和账单并不保证能通过 CSV 转移。</p><div class="settingsActions"><button class="btn blue" data-act="selectCsv">${ic('upload')} 导入 MoneyWiz CSV</button><button class="btn" data-act="csvHelp">操作说明</button></div></div><div class="card settingsCard"><h3>共享信用额度池</h3><p>同一币种的多张信用卡共享授信额度，各卡独立账单日、还款日和账单金额。</p><div class="settingsActions"><button class="btn" data-act="newPool">${ic('plus')} 新建额度池</button></div>${(state.creditPools||[]).map(p=>`<button class="poolCard" data-act="editPool" data-id="${E(p.id)}"><div><b>${E(p.name)}</b><small>${E(p.currency)} · 额度 ${fmt(p.limit,p.currency)}</small></div><span>编辑 ›</span></button>`).join('')}</div><div class="card settingsCard"><h3>多币种与汇率</h3><p>跨币种转账按实际转出与到账金额记录。报表折合人民币时采用你手动录入的汇率，不联网。</p><div class="settingsActions"><button class="btn" data-act="fxForm">${ic('chart')} 管理报表汇率</button></div></div><div class="card settingsCard"><h3>完整备份与恢复</h3><p>JSON 文件包含账户、共享额度、交易、优惠、标签、附件和汇率。恢复会替换本应用现有账本。</p><div class="settingsActions"><button class="btn soft" data-act="backupJson">${ic('download')} 备份 JSON</button><button class="btn" data-act="restoreJson">恢复 JSON</button><button class="btn" data-act="exportCsv">导出交易 CSV</button></div></div><div class="card settingsCard"><h3>账户管理、分组及资产负债统计</h3><p>可在“编辑账户”中独立控制是否纳入资产负债统计，和是否在首页隐藏互不影响。共 ${state.accounts.length} 个账户、${state.transactions.length} 笔交易。账户数量不限；关闭或删除主屏幕App可能丢失本地数据。</p><div class="settingsActions"><button class="btn" data-act="newAccount">${ic('plus')} 新建账户</button><button class="btn" data-act="manageGroups">管理分组</button></div>${state.accounts.filter(a=>a.hidden).map(a=>`<button class="poolCard" data-act="editAccount" data-id="${E(a.id)}"><div><b>${E(a.name)}</b><small>已隐藏 · 点击编辑以恢复显示</small></div><span>编辑 ›</span></button>`).join('')}</div><div class="notice">⚠️ <b>数据安全：</b>数据只保存在当前浏览器或主屏幕 PWA 的 IndexedDB，不自动同步、不加密。请在真实迁移前完整备份 MoneyWiz，并定期导出 JSON 到独立、安全的位置。不要将私人账本文件放到公共网页托管目录。</div><div class="pageFoot">存储：${storage==='idb'?'IndexedDB':storage==='localStorage'?'localStorage 兼容模式':'无法持久保存'} · 简账 v3.3.1</div></div>`}

async function compressAccountIcon(file){
 if(!['image/png','image/jpeg','image/webp'].includes(file.type))throw Error('账户图标仅支持 PNG、JPG 或 WEBP');
 if(file.size>5*1024*1024)throw Error('账户图标不能超过5MB');
 let url=URL.createObjectURL(file);
 try{
  let pic=new Image();pic.src=url;await new Promise((resolve,reject)=>{pic.onload=resolve;pic.onerror=()=>reject(Error('图片读取失败'))});
  let canvas=document.createElement('canvas');canvas.width=128;canvas.height=128;
  let ctx=canvas.getContext('2d');if(!ctx)throw Error('浏览器无法处理图片');
  const crop=Math.min(pic.naturalWidth,pic.naturalHeight);
  ctx.drawImage(pic,(pic.naturalWidth-crop)/2,(pic.naturalHeight-crop)/2,crop,crop,0,0,128,128);
  const data=canvas.toDataURL('image/png');
  if(data.length>340000)throw Error('压缩后的图标仍然过大，请换一张简单的图片');
  return data;
 }finally{URL.revokeObjectURL(url)}
}

// CSV parser: supports quoted multiline text, UTF-8 BOM and comma/semicolon/tab separators.
function delimiterOf(str){let first=str.split(/\r?\n/,3)[0]||'';let best=',',n=-1;for(let c of [',','\t',';']){let cnt=0,quoted=false;for(let i=0;i<first.length;i++){if(first[i]==='"'){if(quoted&&first[i+1]==='"')i++;else quoted=!quoted}else if(first[i]===c&&!quoted)cnt++}if(cnt>n){best=c;n=cnt}}return best}
function parseCSV(s){s=s.replace(/^\ufeff/,'').replace(/^sep\s*=\s*([,;\t])\s*(?:\r\n|\n|\r)/i,'');let delimiter=delimiterOf(s),out=[],row=[],part='',q=false;for(let i=0;i<s.length;i++){let c=s[i];if(c==='"'){if(q&&s[i+1]==='"'){part+='"';i++}else q=!q}else if(c===delimiter&&!q){row.push(part);part=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&s[i+1]==='\n')i++;row.push(part);if(row.some(v=>v!==''))out.push(row);row=[];part=''}else part+=c;}row.push(part);if(row.some(v=>v!==''))out.push(row);if(out.length<2)throw Error('CSV没有可导入的数据行');if(out.length>150000)throw Error('CSV超过当前支持的150000行上限');const header=out.shift().map((x,i)=>x.trim()||`第${i+1}列`);return {header,rows:out,delimiter}}
const MAP=[['date','交易日期（必选）'],['time','时间（选填）'],['account','账户名称'],['amount','金额（必选）'],['currency','币种'],['type','交易类型'],['category','分类'],['description','描述'],['payee','交易对方'],['note','备注'],['transfer','转账标记/转入账户'],['balance','账户余额（供核对）'],['discount','立减优惠（选填）'],['tags','标签（选填）'],['splits','拆分分类（选填）']];
const ALIASES={time:['时间','交易时间','transaction time'],date:['date','日期','交易日期','transaction date','time','datetime','日期及时间'],account:['account','账户','账户名称','account name','name'],amount:['amount','金额','交易金额','value','transaction amount','总金额'],currency:['currency','币种','货币','curr'],type:['type','类型','交易类型','transaction type','kind'],category:['category','分类','类别','category name'],description:['description','描述','交易描述','摘要','title','details','详情'],payee:['payee','付款人','收款人','交易对方','merchant','payee/payer','payer'],note:['memo','备注','notes','note','comment','备注信息'],transfer:['transfers','transfer','转账','转入账户','to account','transfer to','linked account'],balance:['balance','current balance','余额','当前余额','账户余额','running balance'],discount:['discount','立减优惠','立减金','优惠金额'],tags:['tags','标签'],splits:['splits','分类拆分','拆分分类']};
function guessMapping(h){let map={};for(let [key] of MAP){map[key]=-1;let names=ALIASES[key]||[];let norm=s=>s.toLowerCase().replace(/[\s_\-#().]/g,'');let best=h.findIndex(c=>names.some(n=>norm(c)===norm(n)));if(best<0)best=h.findIndex(c=>names.some(n=>norm(c).includes(norm(n))));map[key]=best;}return map}
async function readCsvWithEncoding(file,encoding){let b=await file.arrayBuffer();if(b.byteLength>20e6)throw Error('CSV文件过大，单文件不应超过20MB');return new TextDecoder(encoding).decode(b)}

function isMWMixedReport(head){let h=new Set(head);return ['命名','当前余额','账户','金额','日期'].every(k=>h.has(k))}
function getMWReportInfo(parsed){
 if(!isMWMixedReport(parsed.header))return null;
 const h=parsed.header,index=k=>h.indexOf(k), a=index('命名'),b=index('当前余额'),ac=index('账户'),dt=index('日期'),amt=index('金额');
 const accountRows=parsed.rows.filter(r=>r[a]?.trim()&&r[b]?.trim()&&!r[ac]?.trim()&&!r[dt]?.trim()&&!r[amt]?.trim());
 const txRows=parsed.rows.filter(r=>r[ac]?.trim()&&r[dt]?.trim()&&r[amt]?.trim());
 const other=parsed.rows.length-accountRows.length-txRows.length;
 const dates=txRows.map(r=>dateVal(r[dt])?.date).filter(Boolean);

  let splits=[];if(txType==='expense'&&$('splitToggle').checked){for(const row of document.querySelectorAll('.splitLine')){let cat=row.querySelector('.splitCategory').value.trim(),v=cents(row.querySelector('.splitAmount').value||'0');if(!cat&&v===0)continue;if(!cat||v<=0)throw Error('拆分类别及金额均不能为空');splits.push({category:cat,amount:v})}if(splits.length<2)throw Error('分类拆分至少需要2个类别');if(splits.reduce((s,v)=>s+v.amount,0)!==amount)throw Error('分类拆分金额合计必须等于实际支付金额')}
  let tags=[...new Set(String(form.get('tags')||'').split(/[,，;；]/).map(v=>v.trim()).filter(Boolean))].slice(0,20);let old=editing&&state.transactions.find(x=>x.id===editing);let remaining=[];if(old?.attachments?.length){let removed=new Set([...document.querySelectorAll('#existingAttachments .attachmentChip')].map(n=>Number(n.dataset.index)));remaining=old.attachments.filter((z,i)=>removed.has(i))}let files=Array.from($('txAttachments').files||[]);if(remaining.length+files.length>5)throw Error('最多只能保存5张附件图片');for(const file of files){if(!/^image\/(jpeg|png|webp)$/.test(file.type))throw Error('附件只支持JPG、PNG、WebP');if(file.size>12*1024*1024)throw Error('原始图片超过12MB');remaining.push({name:file.name,data:await compressImage(file)})}
  let x={id:old?.id||uid(),type:txType,from,to:txType==='transfer'?to:'',amount,toAmount,date:form.get('date'),time:form.get('time')||'',category:txType==='transfer'?'转账':String(form.get('category')||'未分类').trim()||'未分类',description:String(form.get('description')||'').trim(),payee:String(form.get('payee')||'').trim(),note:String(form.get('note')||'').trim(),tags,discount,splits,attachments:remaining,adjustSign:old?.adjustSign===1?1:-1,created:old?.created||new Date().toISOString(),importFingerprint:old?.importFingerprint||'',source:old?.source||''};
  if(old)Object.assign(old,x);else state.transactions.push(x);await save();closeModal();render();t('交易已保存');return}
 if(name==='deleteTx'){let x=state.transactions.find(x=>x.id===editing);if(x&&confirm('确定删除这笔交易吗？')){state.transactions=state.transactions.filter(t=>t.id!==x.id);await save();closeModal();render();t('已删除交易')}return}
}catch(err){alert('操作失败：'+err.message)}}

function adaptTxForm(){const f=$('txForm');if(!f)return;const transfer=txType==='transfer',expense=txType==='expense';f.querySelector('#txToWrap').classList.toggle('hide',!transfer);f.querySelector('#targetAmountWrap').classList.toggle('hide',!transfer);f.querySelector('#categoryWrap').classList.toggle('hide',transfer);f.querySelector('#discountWrap').classList.toggle('hide',!expense);f.querySelector('#splitWrap').classList.toggle('hide',!expense);f.querySelectorAll('[data-txtype]').forEach(x=>x.classList.toggle('active',x.dataset.txtype===txType));let from=account(f.elements.account.value),to=account(f.elements.to.value);$('txCurrency').textContent=from?.currency||'CNY';let cross=transfer&&from&&to&&from.currency!==to.currency;let input=f.elements.toAmount;input.disabled=!cross;input.required=!!cross;input.placeholder=cross?`实际到账 ${to.currency}`:'默认与转出金额相同';updateDiscountPreview()}
function updateDiscountPreview(){let f=$('txForm');if(!f)return;let amt=Number(f.elements.amount.value)||0,dis=Number(f.elements.discount.value)||0;const currency=account(f.elements.account.value)?.currency||'CNY';$('discountPreview').textContent=`原价 ${fmt(Math.round((amt+dis)*100),currency)} − 优惠 ${fmt(Math.round(dis*100),currency)} = 实付 ${fmt(Math.round(amt*100),currency)}`}
function showSuggestions(field){let f=$('txForm');if(!f)return;let q=String(field.value||'').trim().toLowerCase();let box=$('suggestBox');if(!q){box.classList.add('hide');return}let matches=new Map();const current=f.elements.account.value;for(const x of state.transactions){if(!['income','expense'].includes(x.type)||x.type!==txType)continue;if(!(x.description||x.payee))continue;if(!(x.description||'').toLowerCase().includes(q)&&!(x.payee||'').toLowerCase().includes(q))continue;let key=[x.description,x.payee,x.category].join('\u0001');let o=matches.get(key)||{description:x.description,payee:x.payee,category:x.category,count:0,last:'',same:0};o.count++;o.same+=x.from===current?1:0;o.last=([x.date,x.time||''].join(' ')>o.last)?[x.date,x.time||''].join(' '):o.last;matches.set(key,o)}
 window.__suggestions=[...matches.values()].sort((a,b)=>b.same-a.same||b.count-a.count||b.last.localeCompare(a.last)).slice(0,7);box.classList.toggle('hide',!window.__suggestions.length);box.innerHTML=window.__suggestions.map((x,i)=>`<button type="button" class="suggestRow" data-act="chooseSuggestion" data-id="${i}"><b>${E(x.description||x.payee)}</b><small>${E(x.payee||'')} · ${E(x.category||'未分类')} · 历史${x.count}次</small></button>`).join('')}
async function compressImage(file){return await new Promise((resolve,reject)=>{let img=new Image();let url=URL.createObjectURL(file);img.onload=()=>{try{let ratio=Math.min(1,1400/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*ratio));canvas.height=Math.max(1,Math.round(img.height*ratio));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);let data=canvas.toDataURL('image/jpeg',.78);URL.revokeObjectURL(url);if(data.length>3_000_000)throw Error('压缩后附件仍过大');resolve(data)}catch(e){URL.revokeObjectURL(url);reject(e)}};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('附件图片无法读取'))};img.src=url})}

function updateList(){if(page!=='ledger')return;let l=filtered();let el=$('ledgerResults');if(el)el.innerHTML=(l.length?l.slice(0,500).map(x=>txRow(x,filter.account)).join(''):'<div class="empty">没有找到匹配的交易记录</div>')+(l.length>500?'<div class="empty">只显示最新500笔，请使用搜索缩小范围。</div>':'');if($('ledgerCount'))$('ledgerCount').textContent='共 '+l.length+' 笔';if($('ledgerTotals'))$('ledgerTotals').innerHTML=ledgerSummary(l)}
document.addEventListener('click',e=>{let a=e.target.closest('[data-act]');if(a){e.preventDefault();act(a.dataset.act,a.dataset.id||'');return}let b=e.target.closest('[data-page]');if(b){page=b.dataset.page;accountDetail='';render();window.scrollTo(0,0);return}let tab=e.target.closest('[data-txtype]');if(tab){txType=tab.dataset.txtype;adaptTxForm()}});
document.addEventListener('input',e=>{if(e.target.id==='searchQ'){filter.q=e.target.value;updateList()}else if(e.target.id==='txDesc'||e.target.id==='txPayee'){showSuggestions(e.target)}else if(e.target.id==='txAmount'||e.target.id==='txDiscount'){updateDiscountPreview()}});document.addEventListener('change',e=>{let id=e.target.id;if(id==='ledgerAccount'){filter.account=e.target.value;updateList()}else if(id==='ledgerMonth'){filter.month=e.target.value;updateList()}else if(id==='reportMonth'){reportMonth=e.target.value||curMonth();render()}else if(id==='reportCurrency'){reportCurrency=e.target.value;render()}else if((id==='txFrom'||id==='txTo')&&$('txForm'))adaptTxForm();else if((id==='accountKind'||id==='accountCurrency')&&$('accountForm')){adaptAccountForm();updateAccountIconPreview()}else if(id==='accountIconChoice'&&$('accountForm'))updateAccountIconPreview();else if(id==='accountIconFile'&&$('accountForm')){if(e.target.files?.length)$('accountIconChoice').value='custom';updateAccountIconPreview()}else if(id==='splitToggle')$('splitRows').classList.toggle('hide',!e.target.checked);else if(id==='csvEncoding'&&csvContext&&csvContext.encoding!==e.target.value){const encoding=e.target.value;loadCsv(csvContext.file,encoding).catch(err=>alert('重读CSV失败：'+err.message))}});
$('csvFile').addEventListener('change',async e=>{let file=e.target.files?.[0];if(!file)return;try{await loadCsv(file)}catch(err){alert('读取CSV失败：'+err.message)}finally{e.target.value=''}});
$('jsonFile').addEventListener('change',async e=>{let file=e.target.files?.[0];if(file)await restore(file);e.target.value=''});
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('modal').hidden)closeModal()});initStorage();
})();
</script></body></html>
